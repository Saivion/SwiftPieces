name: Swift

# Type-checks the library and builds the preview app on every push and pull request to main,
# and when someone starts it by hand. Path filters used to hide a red run after Swift changed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift:
    name: Swift (type-check every piece against the iOS 26 SDK)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      # Runner images name Xcode with its full version (Xcode_26.0.app, Xcode_26.1.app, ...), so pick
      # the newest Xcode 26 that is installed instead of hard-coding a path.
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "No Xcode 26 on this runner:"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      # Xcode 26 ships the Metal compiler as a separate component; the type-check compiles .metal files.
      - name: Metal toolchain
        run: xcrun -sdk iphonesimulator metal --version || xcodebuild -downloadComponent MetalToolchain
      - run: bash scripts/typecheck-swift.sh
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # patterns is the check the builder README documents. `all` also compiles every definition
      # variant and thirty styled projects, which is a local pass rather than every push.
      - name: Playground patterns type-check
        run: npx tsx scripts/typecheck-playground.ts patterns
      - name: Build preview app (all pieces in one target)
        run: |
          xcodebuild -project previews/SwiftPiecesPreviews.xcodeproj -scheme SwiftPiecesPreviews \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath previews/build -quiet build
