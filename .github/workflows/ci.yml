name: CI

on:
  push:
    branches: [main]
  pull_request:

# The automatic GITHUB_TOKEN gets read-only access by default. Checks never write to the repo.
permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    # gitleaks reads PR commits and comments on the PR when it finds a leaked secret.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: Web (build, OpenNext, bundle gate, public-safety audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run brand:build
      - run: npm run registry:build
      - name: Generated files are committed
        run: git diff --exit-code -- registry/__registry__ content/docs public/llms.txt public/schema
      - run: npm run typecheck
      - run: npm run cli:build
      - run: npx opennextjs-cloudflare build
      - name: Worker bundle under 8 MB compressed
        run: npm run bundle:check
      - name: Public-safety audit
        run: npm run audit:public
