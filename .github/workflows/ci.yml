name: CI

on:
  push:
    branches: [main]
  pull_request:

# The automatic GITHUB_TOKEN gets read-only access by default. Checks never write to the repo.
permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks reads PR commits and comments on the PR when it finds a leaked secret.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: Web (build, OpenNext, bundle gate, public-safety audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run brand:build
      - run: npm run registry:build
      - name: Generated files are committed
        run: git diff --exit-code -- registry/__registry__ content/docs public/llms.txt public/schema
      - run: npm run typecheck
      - run: npm run cli:build
      - run: npx opennextjs-cloudflare build
      - name: Worker bundle under 8 MB compressed
        run: npm run bundle:check
      - name: Public-safety audit
        run: npm run audit:public

  swift:
    name: Swift (type-check every piece against the iOS 26 SDK)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app
      - run: bash scripts/typecheck-swift.sh
      - name: Build preview app (all pieces in one target)
        run: |
          xcodebuild -project previews/SwiftPiecesPreviews.xcodeproj -scheme SwiftPiecesPreviews \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath previews/build -quiet build
